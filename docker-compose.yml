version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduglobal
      POSTGRES_PASSWORD: eduglobal_secret
      POSTGRES_DB: eduglobal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduglobal"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://eduglobal:eduglobal_secret@db:5432/eduglobal
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:4000,http://127.0.0.1:4000
      SEED_ON_START: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        # Single-URL mode: /api/* on the web origin is proxied to the API service
        API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    ports:
      - "4000:4000"

volumes:
  pgdata:
